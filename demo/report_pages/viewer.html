<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SochIQ Executive Report Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1e1e24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #eaeaea;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .top-toolbar {
      height: 48px;
      background-color: #16161b;
      border-bottom: 1px solid #2e2e38;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      user-select: none;
      flex-shrink: 0;
    }
    .doc-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }
    .doc-badge {
      background-color: #ffdf00;
      color: #111111;
      font-weight: 700;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .doc-title {
      color: #ffffff;
    }
    .doc-pages {
      font-size: 12px;
      color: #888899;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tool-btn {
      background-color: #262630;
      border: 1px solid #363644;
      color: #eaeaea;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-btn-primary {
      background-color: #ffdf00;
      color: #111111;
      border-color: #ffdf00;
      font-weight: 600;
    }
    .doc-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 30px 0 60px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: radial-gradient(circle at 50% 20%, #25252e 0%, #15151a 100%);
    }
    .pdf-page-container {
      background: white;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      overflow: hidden;
      max-width: 900px;
      width: 90%;
    }
    .pdf-page-container img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-toolbar">
    <div class="doc-info">
      <span class="doc-badge">PDF REPORT</span>
      <span class="doc-title">SochIQ_Report_sample_ecommerce_orders.pdf</span>
      <span class="doc-pages">• &nbsp;Page 1 of 1</span>
    </div>
    <div class="toolbar-actions">
      <span class="tool-btn">100% Fit Width</span>
      <span class="tool-btn tool-btn-primary">✓ Verified Genuine Report</span>
    </div>
  </div>

  <div class="doc-viewport" id="docViewport">
    <div class="pdf-page-container">
      <img src="report_page_1.png" alt="SochIQ Executive Report Page 1">
    </div>
  </div>
</body>
</html>
